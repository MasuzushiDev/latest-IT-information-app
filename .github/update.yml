name: Update articles

on:
  schedule:
    # cron は UTC で書く（JST = UTC + 9時間）。毎時0分は混み合うので、少しずらしている
    - cron: "47 20 * * *"   # 毎日 JST 05:47（朝の通勤前）
    - cron: "47 7 * * *"    # 毎日 JST 16:47（夕方の帰宅前）
  workflow_dispatch:         # Actionsタブの「Run workflow」ボタンから手動実行もできる

permissions:
  contents: write            # storage/ の変更をコミット・pushするために必要

concurrency:
  group: update-articles     # 同時に2つ走って push が衝突するのを防ぐ
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch articles
        run: python main.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add storage
          if git diff --cached --quiet; then
            echo "新しい記事はありません。コミットしません。"
          else
            git commit -m "Update articles $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi